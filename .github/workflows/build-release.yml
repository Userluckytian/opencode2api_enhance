name: build-and-release

# 触发：
#   - push 到 main / feat/desktop-app，且提交信息含「CI」时自动打包（产物=artifacts）
#   - push 版本 tag（v*）时自动打包 + 发布 GitHub Release（产物=Release 附件，正文取自 CHANGELOG.md 对应版本段落）
on:
  push:
    branches:
      - main
      - feat/desktop-app
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            go_bin: opencode2api.exe
            # 三进程架构的免费层引擎（40080，外部 GPL 程序）按目标平台交叉构建
            goos: windows
            goarch: amd64
            engine_bin: opencode2api-win.exe
            bundles: nsis
            updater_platform: windows-x86_64
            win_dll: true
          - os: ubuntu-latest
            go_bin: opencode2api
            goos: linux
            goarch: amd64
            engine_bin: opencode2api-win
            bundles: deb,appimage
            updater_platform: linux-x86_64
            win_dll: false
          - os: macos-latest
            go_bin: opencode2api
            goos: darwin
            goarch: arm64
            engine_bin: opencode2api-win
            bundles: dmg,app
            updater_platform: darwin-aarch64
            win_dll: false
          # Intel Mac：macos-latest 宿主是 arm64，需显式 --target 交叉构建。
          - os: macos-latest
            go_bin: opencode2api
            goos: darwin
            goarch: amd64
            engine_bin: opencode2api-win
            bundles: dmg,app
            updater_platform: darwin-x86_64
            win_dll: false
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    if: contains(github.event.head_commit.message, 'CI') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Intel Mac 需要额外安装 Rust 目标（macos-latest 宿主是 arm64）
      - name: Add Rust target (${{ matrix.target }})
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 本仓库 go.mod 声明 go 1.22；免费层引擎 opencode2api-win 的 go.mod 声明
          # go 1.24，且 setup-go 固定版本时不会自动切换工具链 —— 统一用 1.24
          # （1.24 构建 go 1.22 模块向后兼容，无风险）。
          go-version: '1.24'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      # 准备内嵌二进制：embed.rs 用 include_bytes! 把 bin/ 下二进制编译进主程序，
      # 但 bin/ 被 .gitignore 忽略，故 CI 需自行生成到 bin/。
      # v2.0.0 起 bin/ 只有两份：① 本仓库 Go 核心（管理面 40000）
      #                 ② 免费层引擎 opencode2api-win（40080，外部 GPL 程序）
      - name: Build opencode2api (from Go source)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bin/${{ matrix.go_bin }} .
          ls -lh bin/

      # 引擎源码固定快照（617KB = 提交 1a208ac 原样导出）：外部分叉
      # wbi35772/opencode2api-win 已于 2026-11-25 再次 404，CI 不再联网 clone。
      # 构建时解包快照 → 套 registration-proxies 补丁 → 交叉编译；
      # GPL 源码包由后面的步骤从同一棵（已打补丁的）树导出。
      # 运行期由管理器以独立子进程 + HTTP 使用（mere aggregation），产物名与
      # embed.rs / platform_name("opencode2api-win") 对齐。
      - name: Build free-tier engine (opencode2api-win)
        shell: bash
        run: |
          set -euo pipefail
          # 全程相对路径：Windows runner 上的 tar 会把 "D:/..." 当远程主机
          # （tar: Cannot connect to D: resolve failed, exit 2），盘符路径不能喂给它。
          rm -rf engine-src
          mkdir -p engine-src bin
          src_tgz="third_party/opencode2api-win/src/opencode2api-win-1a208ac.tar.gz"
          [ -f "$src_tgz" ] || { echo "::error::missing vendored engine source: $src_tgz"; exit 1; }
          tar -xzf "$src_tgz" -C engine-src
          # 本地补丁（按文件名顺序应用）：
          #   1) registration-proxies：warp.registration_proxies 注册轮换
          #   2) registrar-stats：healthz 暴露每个注册代理的成功/失败计数
          #   3) penalty-tuning：403 network anomaly 走短冷却 + 注册退避上限 5 分钟
          # 必须在仓库根用 --directory 打补丁：在 git 工作树内 cd 进 engine-src 再
          # git apply，git 会把补丁路径解释为「仓库根相对」，目标落在当前目录之外时
          # 静默跳过并返回 0（Skipped patch ...），最终编出未打补丁的二进制。
          patch_dir="third_party/opencode2api-win/patches"
          shopt -s nullglob
          patches=("$patch_dir"/*.patch)
          shopt -u nullglob
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::no engine patches found under $patch_dir"
            exit 1
          fi
          for p in "${patches[@]}"; do
            echo "applying $(basename "$p")"
            git apply -p1 --directory=engine-src --check "$p"
            git apply -p1 --directory=engine-src "$p"
          done
          # 源码级断言：补丁没落到文件上就立刻失败，别等到 grep 二进制才发现。
          grep -q "RegistrationProxies" engine-src/internal/config/config.go || {
            echo "::error::registration-proxies patch did not modify engine-src/internal/config/config.go"
            exit 1
          }
          grep -q "RegistrarStat" engine-src/internal/warp/pool.go || {
            echo "::error::registrar-stats patch did not modify engine-src/internal/warp/pool.go"
            exit 1
          }
          grep -q "status == 403 && networkAnomaly(body)" engine-src/internal/warp/pool.go || {
            echo "::error::penalty-tuning patch missing the 403 network-anomaly classification"
            exit 1
          }
          grep -qE "refillBackoffMax[[:space:]]*=[[:space:]]*5 \* time\.Minute" engine-src/internal/warp/pool.go || {
            echo "::error::penalty-tuning patch missing the registration backoff budget"
            exit 1
          }
          echo "toolchain: $(go version)"
          ( cd engine-src && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags "-s -w" -o ../bin/${{ matrix.engine_bin }} ./cmd/opencode2api )
          # 能力自检：产物里必须有 registration_proxies（Go 会把 struct tag 编进二进制），
          # 防止补丁静默失效后管理器又写出引擎不认的字段；registrars 是第二个补丁的
          # healthz 字段名，同样编进二进制。
          hits="$(grep -a -c registration_proxies "bin/${{ matrix.engine_bin }}" || true)"
          echo "registration_proxies hits in binary: ${hits:-0}"
          if [ "${hits:-0}" -lt 1 ]; then
            echo "::error::engine binary lacks registration_proxies; patch did not apply"
            exit 1
          fi
          stat_hits="$(grep -a -c registrars "bin/${{ matrix.engine_bin }}" || true)"
          echo "registrars hits in binary: ${stat_hits:-0}"
          if [ "${stat_hits:-0}" -lt 1 ]; then
            echo "::error::engine binary lacks registrar stats; registrar-stats patch did not apply"
            exit 1
          fi
          # Windows 下 chmod 无意义，失败忽略；非 Windows 必须有执行位（spawn 会 Permission denied）
          chmod +x "bin/${{ matrix.engine_bin }}" || true
          ls -lh bin/

      # 节点池内核 mihomo（GPL-3.0 独立进程，v1.19.33 固定版本）：
      # 与 third_party/mihomo/SOURCE.txt 的资产名/哈希保持一致；缺失只影响节点池。
      - name: Fetch mihomo (node-pool kernel)
        shell: bash
        env:
          MIHOMO_VERSION: v1.19.33
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          case "${TARGET_GOOS}/${TARGET_GOARCH}" in
            windows/amd64) asset="mihomo-windows-amd64-${MIHOMO_VERSION}.zip"
                           sha="6ab2180875f9f6fff8b19386d760daec257f66b45f72b3afc650634272fa837a" ;;
            linux/amd64)   asset="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
                           sha="132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323" ;;
            darwin/arm64)  asset="mihomo-darwin-arm64-${MIHOMO_VERSION}.gz"
                           sha="060b64b0f2c9a310831db0fe4adb2878de67bfa606c311813c1f13966aa504b6" ;;
            darwin/amd64)  asset="mihomo-darwin-amd64-${MIHOMO_VERSION}.gz"
                           sha="551ae54ef8d77a5e21f7a8185a59b441fb13a0fb0514fcdef5ca2816f6f50015" ;;
            *) echo "::error::mihomo 没有 ${TARGET_GOOS}/${TARGET_GOARCH} 的固定资产"; exit 1 ;;
          esac
          url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${asset}"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-delay 3 -o "$tmp/$asset" "$url"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$sha  $tmp/$asset" | sha256sum -c -
          else
            echo "$sha  $tmp/$asset" | shasum -a 256 -c -
          fi
          mkdir -p bin
          if [ "${asset##*.}" = "zip" ]; then
            unzip -oq "$tmp/$asset" -d "$tmp"
            # 官方 zip 里的文件名带平台后缀（mihomo-windows-amd64.exe）
            src="$(find "$tmp" -type f -name '*.exe' -print -quit)"
            [ -n "$src" ] || { echo "::error::压缩包里没有 .exe"; exit 1; }
            cp "$src" bin/mihomo.exe
          else
            gunzip -c "$tmp/$asset" > bin/mihomo
            chmod +x bin/mihomo
          fi
          rm -rf "$tmp"
          ls -lh bin/

      # GPL-3.0 义务：随引擎二进制分发「与本次构建完全一致」的源码 + 提交号
      # （LICENSE / SOURCE.txt / README.md 已在仓库 third_party/ 里入库）。
      # git archive 从 engine-src 导出 tar.gz（HEAD 已包含 registration-proxies
      # 补丁提交）；COMMIT.txt 同时写上游提交与补丁后的提交，供核对。
      - name: Package GPL source (opencode2api-win)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/opencode2api-win
          patch_dir="third_party/opencode2api-win/patches"
          patch_lines=""
          summary_patches=""
          shopt -s nullglob
          for p in "$patch_dir"/*.patch; do
            if command -v sha256sum >/dev/null 2>&1; then
              sum="$(sha256sum "$p" | cut -d' ' -f1)"
            else
              sum="$(shasum -a 256 "$p" | cut -d' ' -f1)"
            fi
            patch_lines="${patch_lines}patch:    $(basename "$p") sha256=${sum}"$'\n'
            summary_patches="${summary_patches}${summary_patches:+, }$(basename "$p")"
          done
          shopt -u nullglob
          # 从「解包 + 全部补丁」后的同一棵树导出源码，保证与二进制一致（GPL-3.0）。
          tar -czf third_party/opencode2api-win/opencode2api-win-source.tar.gz -C engine-src .
          {
            echo "upstream: 1a208acbda4346e9492a6ad5266a46b70b21642f (v1.5.1-win.1)"
            echo "source:   third_party/opencode2api-win/src/opencode2api-win-1a208ac.tar.gz"
            printf "%s" "$patch_lines"
          } > third_party/opencode2api-win/COMMIT.txt
          echo "engine source: 1a208ac + ${summary_patches}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh third_party/opencode2api-win/

      # tauri.conf 的 resources 引用 WebView2Loader.dll 仅 Windows 需要；
      # Windows 用仓库内 src-tauri/WebView2Loader.dll（已验证版本），非 Windows 放占位文件
      # 避免 resources 缺失报错（产物不含该 dll 逻辑）。
      - name: Prepare WebView2Loader.dll (Windows)
        if: matrix.win_dll == true
        shell: bash
        run: |
          mkdir -p src-tauri/target/release
          cp src-tauri/WebView2Loader.dll src-tauri/target/release/WebView2Loader.dll

      - name: Placeholder WebView2Loader.dll (non-Windows)
        if: matrix.win_dll == false
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/WebView2Loader.dll

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      # v2.0.0：不再有 Bun sidecar / sing-box —— 免费层由外部引擎进程（40080）承担，
      # 已在上面 "Build free-tier engine" 步骤产出并内嵌。

      - name: Tauri build (bundles ${{ matrix.bundles }})
        shell: bash
        env:
          # 应用内更新（Tauri updater）所需签名；私钥与密码放在仓库 Secrets 中
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_TARGET:-}" ]; then
            npx tauri build --target "$TAURI_TARGET" --bundles "$BUNDLES"
            # 交叉构建的产物在 target/<triple>/release 下；统一搬到默认路径，
            # 后续「收集元数据 / 上传产物」步骤无需感知 target。
            rm -rf src-tauri/target/release/bundle
            mkdir -p src-tauri/target/release
            cp -R "src-tauri/target/$TAURI_TARGET/release/bundle" src-tauri/target/release/bundle
          else
            npx tauri build --bundles "$BUNDLES"
          fi

      # 每个平台产出 updater 元数据（平台标识 + 安装包相对路径 + 签名），
      # 供 release job 生成 latest.json。macOS 的上传包名不含架构，不能靠文件名推断。
      - name: Collect updater artifact metadata
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import json, os, pathlib, sys

          root = pathlib.Path("src-tauri/target/release/bundle")
          candidates = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              n = p.name.lower()
              if n.endswith(".sig") or n.endswith(".deb") or n.endswith(".dmg"):
                  continue
              if n.endswith(".exe"):
                  prio = 0
              elif n.endswith(".appimage.tar.gz"):
                  prio = 0
              elif n.endswith(".appimage"):
                  prio = 1
              elif n.endswith(".app.tar.gz"):
                  prio = 0
              else:
                  continue
              candidates.append((prio, p))

          if not candidates:
              sys.exit("未找到 updater 安装包（NSIS .exe / AppImage / app.tar.gz）")

          candidates.sort(key=lambda x: x[0])
          _, artifact = candidates[0]
          sig = pathlib.Path(str(artifact) + ".sig")
          if not sig.exists():
              sys.exit(f"缺少签名文件：{sig}（请确认 TAURI_SIGNING_PRIVATE_KEY 已配置）")

          meta = {
              "platform": os.environ["UPDATER_PLATFORM"],
              "artifact": artifact.relative_to(root).as_posix(),
              "signature": sig.read_text(encoding="utf-8").strip(),
          }
          out = root / f"updater-meta-{meta['platform']}.json"
          out.write_text(json.dumps(meta, ensure_ascii=False), encoding="utf-8")
          print(f"updater: {meta['platform']} -> {meta['artifact']}")
          PY
        env:
          UPDATER_PLATFORM: ${{ matrix.updater_platform }}

      - name: Upload artifact (${{ matrix.updater_platform }})
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-${{ matrix.updater_platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/updater-meta-*.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            # GPL-3.0 分发件：引擎许可证/来源声明 + 与本次构建一致的源码包
            third_party/opencode2api-win/LICENSE
            third_party/opencode2api-win/SOURCE.txt
            third_party/opencode2api-win/README.md
            third_party/opencode2api-win/COMMIT.txt
            third_party/opencode2api-win/opencode2api-win-source.tar.gz
            # GPL-3.0 分发件：节点池内核 mihomo 的许可证/来源声明
            third_party/mihomo/LICENSE
            third_party/mihomo/SOURCE.txt
            third_party/mihomo/README.md

  # GitHub Release：仅 tag（v*）触发时执行——汇总三平台产物并发布（首次新建，幂等）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需读仓库里的 CHANGELOG.md；fetch-depth: 0 便于 git describe 找到上一版本 tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 用 CHANGELOG.md 中对应版本段落作为 Release 正文；找不到时回退为 Full Changelog 链接
      - name: Compose release body from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          python3 - "$tag" .release-extract.md <<'PY'
          import sys, pathlib, re
          tag, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          p = pathlib.Path("CHANGELOG.md")
          body = ""
          if p.exists():
              out, capture = [], False
              for ln in p.read_text(encoding="utf-8").splitlines():
                  if ln.startswith("## "):
                      if capture:
                          break
                      h = ln[3:].strip()
                      m = re.match(r"[0-9A-Za-z.\-]+", h)
                      head = m.group(0) if m else h
                      if head == tag:
                          capture = True
                          continue
                  if capture:
                      out.append(ln)
              body = "\n".join(out).strip()
          out_path.write_text(body, encoding="utf-8")
          PY
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            if [ -s .release-extract.md ]; then
              cat .release-extract.md
              echo
            else
              echo "**${tag}**"
              echo
            fi
            echo "---"
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            fi
          } > RELEASE_BODY.md
          echo "上一版本: ${prev:-（未找到）}"
          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      # 生成 Tauri updater 清单：读取各平台构建阶段产出的 updater-meta-*.json，
      # 配对出安装包 URL（平台标识由构建矩阵给出，避免 macOS 文件名不含架构导致误判）。
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.parse

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.lower().startswith("v") else tag

          metas = sorted(pathlib.Path("release").rglob("updater-meta-*.json"))
          if not metas:
              raise SystemExit("未找到 updater 元数据：请检查构建矩阵 updater_platform 与 createUpdaterArtifacts")

          platforms = {}
          for meta_path in metas:
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              key = meta["platform"]
              artifact = meta_path.parent / meta["artifact"]
              if not artifact.exists():
                  raise SystemExit(f"updater 安装包缺失：{artifact}")
              if key.startswith("darwin-"):
                  # macOS 的 updater 包是 .app.tar.gz，不是用户要的安装包；
                  # 放到内部滚动 release，版本 Release 只保留 .dmg。
                  # 文件名里的架构沿用 Tauri 约定：aarch64 / x64。
                  file_arch = "aarch64" if key.endswith("aarch64") else "x64"
                  rolling_name = f"opencode2api_{version}_{file_arch}.app.tar.gz"
                  url = f"https://github.com/{repo}/releases/download/updater-latest/{urllib.parse.quote(rolling_name)}"
              else:
                  url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(artifact.name)}"
              platforms[key] = {
                  "signature": meta["signature"],
                  "url": url,
              }

          body = pathlib.Path("RELEASE_BODY.md")
          manifest = {
              "version": version,
              "notes": body.read_text(encoding="utf-8").strip() if body.exists() else f"opencode2api {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          out = pathlib.Path("release/latest.json")
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 版本 Release 只放最终安装包（与旧版页面一致）。
          # .sig / .app.tar.gz / latest.json / updater-meta-*.json 都是 updater 内部产物，
          # 统一走内部滚动 release updater-latest，不上版本 Release。
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.dmg
          body_path: RELEASE_BODY.md
          name: opencode2api ${{ github.ref_name }}
          fail_on_unmatched_files: false

      # GPL-3.0：把引擎许可证 + 来源声明 + 与本次构建一致的源码包打成**一个**附件
      # 挂到版本 Release（三平台源码同一固定提交，故只取任一份，避免同名资产冲突）。
      - name: Attach GPL engine source bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          src="$(find release -type f -name 'opencode2api-win-source.tar.gz' -print -quit)"
          [ -n "$src" ] || { echo "未找到引擎源码包（检查 build job 的 third_party 上传路径）"; exit 1; }
          dir="$(dirname "$src")"
          for f in LICENSE SOURCE.txt README.md COMMIT.txt; do
            [ -f "$dir/$f" ] || { echo "缺少 GPL 分发件：$dir/$f"; exit 1; }
          done
          # 附件名带版本号，便于核对；内容 = 许可证 + 声明 + 提交号 + 完整源码
          out="opencode2api-win-gpl-${GITHUB_REF_NAME}"
          rm -rf "$out"; mkdir -p "$out"
          cp "$dir"/LICENSE "$dir"/SOURCE.txt "$dir"/README.md "$dir"/COMMIT.txt "$out/"
          cp "$src" "$out/opencode2api-win-source.tar.gz"
          tar -czf "opencode2api-win-gpl-${GITHUB_REF_NAME}.tar.gz" "$out"
          rm -rf "$out"
          gh release upload "${GITHUB_REF_NAME}" "opencode2api-win-gpl-${GITHUB_REF_NAME}.tar.gz" --clobber

      # 应用内更新的固定端点：rolling release updater-latest 上的 latest.json。
      # 不用 /releases/latest（会排除预发布、且按创建时间而非版本号排序）。
      - name: Publish updater manifest (rolling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release view updater-latest >/dev/null 2>&1 || \
            gh release create updater-latest --prerelease \
              --title "Updater manifest" \
              --notes "由 CI 自动维护的应用内更新清单，请勿手动修改。"
          # macOS 的 .app.tar.gz 是 updater 包：先传滚动 release，再传 latest.json，
          # 保证客户端拿到清单时对应资产已经存在。
          # 每个架构各一份（aarch64 / x64），从各自的 updater-meta 定位产物。
          python3 - <<'PY' > /tmp/mac_assets.txt
          import json, os, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          for meta_path in sorted(pathlib.Path("release").rglob("updater-meta-darwin-*.json")):
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              file_arch = "aarch64" if meta["platform"].endswith("aarch64") else "x64"
              artifact = meta_path.parent / meta["artifact"]
              print(f"{artifact}|/tmp/opencode2api_{version}_{file_arch}.app.tar.gz")
          PY
          while IFS='|' read -r src dst; do
            [ -n "$src" ] || continue
            cp "$src" "$dst"
            gh release upload updater-latest "$dst" --clobber
          done < /tmp/mac_assets.txt
          # 滚动 release 只保留当前版本的两个 macOS updater 包，避免历史版本无限累积。
          keep_a="opencode2api_${version}_aarch64.app.tar.gz"
          keep_b="opencode2api_${version}_x64.app.tar.gz"
          gh release view updater-latest --json assets --jq '.assets[].name' \
            | grep -E '^opencode2api_.*_(aarch64|x64)\.app\.tar\.gz$' \
            | while read -r old; do
                if [ "$old" != "$keep_a" ] && [ "$old" != "$keep_b" ]; then
                  gh release delete-asset updater-latest "$old" -y
                fi
              done || true
          gh release upload updater-latest release/latest.json --clobber

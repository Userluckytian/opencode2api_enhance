name: build-and-release

# 触发：
#   - push 到 main / feat/desktop-app，且提交信息含「CI」时自动打包（产物=artifacts）
#   - push 版本 tag（v*）时自动打包 + 发布 GitHub Release（产物=Release 附件，正文取自 CHANGELOG.md 对应版本段落）
on:
  push:
    branches:
      - main
      - feat/desktop-app
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            go_bin: opencode2api.exe
            # 三进程架构的免费层引擎（40080，外部 GPL 程序）按目标平台交叉构建
            goos: windows
            goarch: amd64
            engine_bin: opencode2api-win.exe
            bundles: nsis
            updater_platform: windows-x86_64
            win_dll: true
          - os: ubuntu-latest
            go_bin: opencode2api
            goos: linux
            goarch: amd64
            engine_bin: opencode2api-win
            bundles: deb,appimage
            updater_platform: linux-x86_64
            win_dll: false
          - os: macos-latest
            go_bin: opencode2api
            goos: darwin
            goarch: arm64
            engine_bin: opencode2api-win
            bundles: dmg,app
            updater_platform: darwin-aarch64
            win_dll: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    if: contains(github.event.head_commit.message, 'CI') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 本仓库 go.mod 声明 go 1.22；免费层引擎 opencode2api-win 的 go.mod 声明
          # go 1.24，且 setup-go 固定版本时不会自动切换工具链 —— 统一用 1.24
          # （1.24 构建 go 1.22 模块向后兼容，无风险）。
          go-version: '1.24'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      # 准备内嵌二进制：embed.rs 用 include_bytes! 把 bin/ 下二进制编译进主程序，
      # 但 bin/ 被 .gitignore 忽略，故 CI 需自行生成到 bin/。
      # v2.0.0 起 bin/ 只有两份：① 本仓库 Go 核心（管理面 40000）
      #                 ② 免费层引擎 opencode2api-win（40080，外部 GPL 程序）
      - name: Build opencode2api (from Go source)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bin/${{ matrix.go_bin }} .
          ls -lh bin/

      # 免费层引擎（40080）：上游 opencode2api-win（GPL-3.0，
      # https://github.com/wbi35772/opencode2api-win）没有可下载的 release 资产，
      # 因此在 CI 内按**固定提交**从源码交叉构建（ENGINE_COMMIT，与
      # third_party/opencode2api-win/SOURCE.txt 保持一致）。
      # 运行期由管理器以独立子进程 + HTTP 使用（mere aggregation：不链接其代码），
      # 产物名与 embed.rs / Go 侧 platform_name("opencode2api-win") 对齐。
      - name: Build free-tier engine (opencode2api-win)
        shell: bash
        env:
          ENGINE_COMMIT: 9964407
        run: |
          set -euo pipefail
          rm -rf engine-src
          git clone --no-checkout https://github.com/wbi35772/opencode2api-win.git engine-src
          git -C engine-src checkout "$ENGINE_COMMIT"
          mkdir -p bin
          ( cd engine-src && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags "-s -w" -o ../bin/${{ matrix.engine_bin }} ./cmd/opencode2api )
          # Windows 下 chmod 无意义，失败忽略；非 Windows 必须有执行位（spawn 会 Permission denied）
          chmod +x "bin/${{ matrix.engine_bin }}" || true
          ls -lh bin/

      # GPL-3.0 义务：随引擎二进制分发「与本次构建完全一致」的源码 + 提交号
      # （LICENSE / SOURCE.txt / README.md 已在仓库 third_party/ 里入库）。
      # git archive 从 engine-src 导出 tar.gz；COMMIT.txt 写完整 sha 供核对。
      - name: Package GPL source (opencode2api-win)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p third_party/opencode2api-win
          sha="$(git -C engine-src rev-parse HEAD)"
          echo "engine commit: $sha"
          # 在 engine-src 内执行 archive：-o 的相对路径按当前工作目录解析，
          # ../third_party = 仓库根的 third_party/（不能用 ../../，会跑到仓库外）
          ( cd engine-src && git archive --format=tar.gz -o ../third_party/opencode2api-win/opencode2api-win-source.tar.gz HEAD )
          printf '%s\n' "$sha" > third_party/opencode2api-win/COMMIT.txt
          echo "$sha" >> "$GITHUB_STEP_SUMMARY"
          ls -lh third_party/opencode2api-win/

      # tauri.conf 的 resources 引用 WebView2Loader.dll 仅 Windows 需要；
      # Windows 用仓库内 src-tauri/WebView2Loader.dll（已验证版本），非 Windows 放占位文件
      # 避免 resources 缺失报错（产物不含该 dll 逻辑）。
      - name: Prepare WebView2Loader.dll (Windows)
        if: matrix.win_dll == true
        shell: bash
        run: |
          mkdir -p src-tauri/target/release
          cp src-tauri/WebView2Loader.dll src-tauri/target/release/WebView2Loader.dll

      - name: Placeholder WebView2Loader.dll (non-Windows)
        if: matrix.win_dll == false
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/WebView2Loader.dll

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      # v2.0.0：不再有 Bun sidecar / sing-box —— 免费层由外部引擎进程（40080）承担，
      # 已在上面 "Build free-tier engine" 步骤产出并内嵌。

      - name: Tauri build (bundles ${{ matrix.bundles }})
        shell: bash
        env:
          # 应用内更新（Tauri updater）所需签名；私钥与密码放在仓库 Secrets 中
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # 每个平台产出 updater 元数据（平台标识 + 安装包相对路径 + 签名），
      # 供 release job 生成 latest.json。macOS 的上传包名不含架构，不能靠文件名推断。
      - name: Collect updater artifact metadata
        shell: bash
        run: |
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "$PY" - <<'PY'
          import json, os, pathlib, sys

          root = pathlib.Path("src-tauri/target/release/bundle")
          candidates = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              n = p.name.lower()
              if n.endswith(".sig") or n.endswith(".deb") or n.endswith(".dmg"):
                  continue
              if n.endswith(".exe"):
                  prio = 0
              elif n.endswith(".appimage.tar.gz"):
                  prio = 0
              elif n.endswith(".appimage"):
                  prio = 1
              elif n.endswith(".app.tar.gz"):
                  prio = 0
              else:
                  continue
              candidates.append((prio, p))

          if not candidates:
              sys.exit("未找到 updater 安装包（NSIS .exe / AppImage / app.tar.gz）")

          candidates.sort(key=lambda x: x[0])
          _, artifact = candidates[0]
          sig = pathlib.Path(str(artifact) + ".sig")
          if not sig.exists():
              sys.exit(f"缺少签名文件：{sig}（请确认 TAURI_SIGNING_PRIVATE_KEY 已配置）")

          meta = {
              "platform": os.environ["UPDATER_PLATFORM"],
              "artifact": artifact.relative_to(root).as_posix(),
              "signature": sig.read_text(encoding="utf-8").strip(),
          }
          out = root / f"updater-meta-{meta['platform']}.json"
          out.write_text(json.dumps(meta, ensure_ascii=False), encoding="utf-8")
          print(f"updater: {meta['platform']} -> {meta['artifact']}")
          PY
        env:
          UPDATER_PLATFORM: ${{ matrix.updater_platform }}

      - name: Upload artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/updater-meta-*.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            # GPL-3.0 分发件：引擎许可证/来源声明 + 与本次构建一致的源码包
            third_party/opencode2api-win/LICENSE
            third_party/opencode2api-win/SOURCE.txt
            third_party/opencode2api-win/README.md
            third_party/opencode2api-win/COMMIT.txt
            third_party/opencode2api-win/opencode2api-win-source.tar.gz

  # GitHub Release：仅 tag（v*）触发时执行——汇总三平台产物并发布（首次新建，幂等）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 需读仓库里的 CHANGELOG.md；fetch-depth: 0 便于 git describe 找到上一版本 tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 用 CHANGELOG.md 中对应版本段落作为 Release 正文；找不到时回退为 Full Changelog 链接
      - name: Compose release body from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          python3 - "$tag" .release-extract.md <<'PY'
          import sys, pathlib, re
          tag, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          p = pathlib.Path("CHANGELOG.md")
          body = ""
          if p.exists():
              out, capture = [], False
              for ln in p.read_text(encoding="utf-8").splitlines():
                  if ln.startswith("## "):
                      if capture:
                          break
                      h = ln[3:].strip()
                      m = re.match(r"[0-9A-Za-z.\-]+", h)
                      head = m.group(0) if m else h
                      if head == tag:
                          capture = True
                          continue
                  if capture:
                      out.append(ln)
              body = "\n".join(out).strip()
          out_path.write_text(body, encoding="utf-8")
          PY
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            if [ -s .release-extract.md ]; then
              cat .release-extract.md
              echo
            else
              echo "**${tag}**"
              echo
            fi
            echo "---"
            echo
            if [ -n "$prev" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            fi
          } > RELEASE_BODY.md
          echo "上一版本: ${prev:-（未找到）}"
          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      # 生成 Tauri updater 清单：读取各平台构建阶段产出的 updater-meta-*.json，
      # 配对出安装包 URL（平台标识由构建矩阵给出，避免 macOS 文件名不含架构导致误判）。
      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, urllib.parse

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.lower().startswith("v") else tag

          metas = sorted(pathlib.Path("release").rglob("updater-meta-*.json"))
          if not metas:
              raise SystemExit("未找到 updater 元数据：请检查构建矩阵 updater_platform 与 createUpdaterArtifacts")

          platforms = {}
          for meta_path in metas:
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              key = meta["platform"]
              artifact = meta_path.parent / meta["artifact"]
              if not artifact.exists():
                  raise SystemExit(f"updater 安装包缺失：{artifact}")
              if key == "darwin-aarch64":
                  # macOS 的 updater 包是 .app.tar.gz，不是用户要的安装包；
                  # 放到内部滚动 release，版本 Release 只保留 .dmg。
                  rolling_name = f"opencode2api_{version}_aarch64.app.tar.gz"
                  url = f"https://github.com/{repo}/releases/download/updater-latest/{urllib.parse.quote(rolling_name)}"
              else:
                  url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(artifact.name)}"
              platforms[key] = {
                  "signature": meta["signature"],
                  "url": url,
              }

          body = pathlib.Path("RELEASE_BODY.md")
          manifest = {
              "version": version,
              "notes": body.read_text(encoding="utf-8").strip() if body.exists() else f"opencode2api {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          out = pathlib.Path("release/latest.json")
          out.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 版本 Release 只放最终安装包（与旧版页面一致）。
          # .sig / .app.tar.gz / latest.json / updater-meta-*.json 都是 updater 内部产物，
          # 统一走内部滚动 release updater-latest，不上版本 Release。
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.rpm
            release/**/*.dmg
          body_path: RELEASE_BODY.md
          name: opencode2api ${{ github.ref_name }}
          fail_on_unmatched_files: false

      # GPL-3.0：把引擎许可证 + 来源声明 + 与本次构建一致的源码包打成**一个**附件
      # 挂到版本 Release（三平台源码同一固定提交，故只取任一份，避免同名资产冲突）。
      - name: Attach GPL engine source bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          src="$(find release -type f -name 'opencode2api-win-source.tar.gz' -print -quit)"
          [ -n "$src" ] || { echo "未找到引擎源码包（检查 build job 的 third_party 上传路径）"; exit 1; }
          dir="$(dirname "$src")"
          for f in LICENSE SOURCE.txt README.md COMMIT.txt; do
            [ -f "$dir/$f" ] || { echo "缺少 GPL 分发件：$dir/$f"; exit 1; }
          done
          # 附件名带版本号，便于核对；内容 = 许可证 + 声明 + 提交号 + 完整源码
          out="opencode2api-win-gpl-${GITHUB_REF_NAME}"
          rm -rf "$out"; mkdir -p "$out"
          cp "$dir"/LICENSE "$dir"/SOURCE.txt "$dir"/README.md "$dir"/COMMIT.txt "$out/"
          cp "$src" "$out/opencode2api-win-source.tar.gz"
          tar -czf "opencode2api-win-gpl-${GITHUB_REF_NAME}.tar.gz" "$out"
          rm -rf "$out"
          gh release upload "${GITHUB_REF_NAME}" "opencode2api-win-gpl-${GITHUB_REF_NAME}.tar.gz" --clobber

      # 应用内更新的固定端点：rolling release updater-latest 上的 latest.json。
      # 不用 /releases/latest（会排除预发布、且按创建时间而非版本号排序）。
      - name: Publish updater manifest (rolling)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release view updater-latest >/dev/null 2>&1 || \
            gh release create updater-latest --prerelease \
              --title "Updater manifest" \
              --notes "由 CI 自动维护的应用内更新清单，请勿手动修改。"
          # macOS 的 .app.tar.gz 是 updater 包：先传滚动 release，再传 latest.json，
          # 保证客户端拿到清单时对应资产已经存在。
          mac="$(find release -name 'opencode2api.app.tar.gz' -print -quit)"
          if [ -n "$mac" ]; then
            out="/tmp/opencode2api_${version}_aarch64.app.tar.gz"
            cp "$mac" "$out"
            gh release upload updater-latest "$out" --clobber
          fi
          # 滚动 release 只保留当前版本的 macOS updater 包，避免历史版本无限累积。
          gh release view updater-latest --json assets --jq '.assets[].name' \
            | grep -E '^opencode2api_.*_aarch64\.app\.tar\.gz$' \
            | grep -vF "opencode2api_${version}_aarch64.app.tar.gz" \
            | while read -r old; do
                gh release delete-asset updater-latest "$old" -y
              done || true
          gh release upload updater-latest release/latest.json --clobber

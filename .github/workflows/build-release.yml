name: build-and-release

# 触发：
#   - push 到 main / feat/desktop-app，且提交信息含「CI」时自动打包（产物=artifacts）
#   - push 版本 tag（v*）时自动打包 + 发布 GitHub Release（产物=Release 附件）
on:
  push:
    branches:
      - main
      - feat/desktop-app
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            go_bin: opencode2api.exe
            sb_name: sing-box.exe
            sb_url: https://github.com/SagerNet/sing-box/releases/download/v1.13.16/sing-box-1.13.16-windows-amd64.zip
            sb_archive: zip
            bundles: nsis
            win_dll: true
          - os: ubuntu-latest
            go_bin: opencode2api
            sb_name: sing-box
            sb_url: https://github.com/SagerNet/sing-box/releases/download/v1.13.16/sing-box-1.13.16-linux-amd64.tar.gz
            sb_archive: targz
            bundles: deb,appimage
            win_dll: false
          - os: macos-latest
            go_bin: opencode2api
            sb_name: sing-box
            sb_url: https://github.com/SagerNet/sing-box/releases/download/v1.13.16/sing-box-1.13.16-darwin-arm64.tar.gz
            sb_archive: targz
            bundles: dmg
            win_dll: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    if: contains(github.event.head_commit.message, 'CI') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      # 准备内嵌二进制：embed.rs 用 include_bytes! 把 bin/ 下二进制编译进主程序，
      # 但 bin/ 被 .gitignore 忽略，故 CI 需自行生成/下载到 bin/。
      - name: Build opencode2api (from Go source)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bin/${{ matrix.go_bin }} .

      - name: Download sing-box (1.13.16, ${{ matrix.os }})
        shell: bash
        run: |
          mkdir -p bin sbx
          # GitHub release 偶发网络抖动（curl 52 Empty reply）：直连重试 4 次，失败切镜像兜底
          dl() {
            local url="$1" out="$2"
            for base in "" "https://gh-proxy.com/" "https://ghfast.top/"; do
              local u="${base}${url}"
              echo "== trying: $u"
              if curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 -o "$out" "$u"; then
                return 0
              fi
            done
            return 1
          }
          if [ "${{ matrix.sb_archive }}" = "zip" ]; then
            dl "${{ matrix.sb_url }}" sb.zip
            unzip -o sb.zip -d sbx
            find sbx -name sing-box.exe -exec cp {} bin/sing-box.exe \;
          else
            dl "${{ matrix.sb_url }}" sb.tgz
            tar -xzf sb.tgz -C sbx
            find sbx -name sing-box -type f -exec cp {} bin/sing-box \;
            chmod +x bin/sing-box
          fi
          ls -lh bin/

      # tauri.conf 的 resources 引用 WebView2Loader.dll 仅 Windows 需要；
      # Windows 用仓库内 src-tauri/WebView2Loader.dll（已验证版本），非 Windows 放占位文件
      # 避免 resources 缺失报错（产物不含该 dll 逻辑）。
      - name: Prepare WebView2Loader.dll (Windows)
        if: matrix.win_dll == true
        shell: bash
        run: |
          mkdir -p src-tauri/target/release
          cp src-tauri/WebView2Loader.dll src-tauri/target/release/WebView2Loader.dll

      - name: Placeholder WebView2Loader.dll (non-Windows)
        if: matrix.win_dll == false
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/WebView2Loader.dll

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      - name: Tauri build (bundles ${{ matrix.bundles }})
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: opencode2api-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg

  # GitHub Release：仅 tag（v*）触发时执行——汇总三平台产物并发布（首次新建，幂等）。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          generate_release_notes: true
          name: opencode2api ${{ github.ref_name }}
          fail_on_unmatched_files: false
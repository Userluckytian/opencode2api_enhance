name: build-and-release

# 触发：push 到 main 自动打包；或 GitHub Actions 页面手动触发（可选手动选分支）
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Windows：绿色单文件 exe（内嵌前端 + 子程序，双击即用） ───────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # embed.rs 用 include_bytes! 把 bin/ 下两个 exe 编译进主程序（bin/ 被 .gitignore 忽略，CI 自行生成）
      - name: Build opencode2api.exe (from Go source)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/opencode2api.exe .

      - name: Download sing-box (1.13.15)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-windows-amd64.zip" -OutFile singbox.zip
          Expand-Archive -Path singbox.zip -DestinationPath singbox-extracted -Force
          Copy-Item -Path "singbox-extracted/sing-box-1.13.15-windows-amd64/sing-box.exe" -Destination "bin/sing-box.exe" -Force

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      # 构建 NSIS 安装包（安装时可选安装目录，绿色 exe 同时产出在 target/release 下）
      - name: Build Windows installer (NSIS)
        shell: bash
        run: npm run tauri:build

      - name: Smoke test (headless serve + health)
        shell: powershell
        run: |
          $exe = "src-tauri\target\release\opencode2api.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "serve","--port","19100" -PassThru
          try {
            Start-Sleep -Seconds 10
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:19100/api/health" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "health returned $($r.StatusCode)" }
            Write-Host "SMOKE_OK: $($r.Content)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ─── Linux：headless 二进制（内嵌前端）+ .deb 桌面包 ──────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux 构建需嵌入 Linux 版子程序（Go ELF + sing-box ELF），
      # 使 headless/deb 的实例启动可用（build.rs 检测到 bin/* 无扩展名则嵌入 ELF）。
      - name: Build opencode2api (Linux, embedded)
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/opencode2api .

      - name: Download sing-box (1.13.15, Linux embedded)
        shell: bash
        run: |
          mkdir -p bin
          wget -q https://github.com/SagerNet/sing-box/releases/download/v1.13.15/sing-box-1.13.15-linux-amd64.tar.gz
          tar -xzf sing-box-1.13.15-linux-amd64.tar.gz
          cp sing-box-1.13.15-linux-amd64/sing-box bin/sing-box

      - name: Build Linux binary + deb package
        run: npm install && npm run tauri:build -- --bundles deb

      - name: Smoke test (headless serve + health)
        shell: bash
        run: |
          ./src-tauri/target/release/opencode2api serve --port 19100 &
          PID=$!
          sleep 8
          curl -sf http://127.0.0.1:19100/api/health && echo "SMOKE_OK"
          kill $PID || true

      - name: Package headless tarball
        run: |
          cd src-tauri/target/release
          tar -czf opencode2api-linux-x86_64-headless.tar.gz opencode2api
          ls -la bundle/deb/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: |
            src-tauri/target/release/opencode2api-linux-x86_64-headless.tar.gz
            src-tauri/target/release/bundle/deb/*.deb

  # ─── 发布：汇总产物到 GitHub Release（draft，人工确认后公开） ──────
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tauri.conf.json
        id: ver
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Write release notes file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const m = content.match(/## v[\s\S]*?(?=\n## |$)/);
            fs.writeFileSync('release-notes.md', m ? m[0].trim() : '')

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若已存在同 tag 的 draft（如上次 run 遗留），先删除再重建，保证产物为本次构建
          if gh release view "app-v${{ steps.ver.outputs.version }}" --json draft -q .draft 2>/dev/null | grep -q true; then
            gh release delete "app-v${{ steps.ver.outputs.version }}" --yes --cleanup-tag
          fi
          gh release create "app-v${{ steps.ver.outputs.version }}" \
            artifacts/windows-installer/*.exe \
            artifacts/linux-headless/opencode2api-linux-x86_64-headless.tar.gz \
            artifacts/linux-headless/bundle/deb/*.deb \
            --draft \
            --title "opencode2api v${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md

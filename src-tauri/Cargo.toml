[package]
name = "opencode2api"
version = "1.5.4"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serde_yaml = "0.9"
anyhow = "1"
sysinfo = "0.30"
dirs = "5"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

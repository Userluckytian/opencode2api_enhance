# 网页自助领 Key 服务 nginx 反向代理 + HTTPS
#
# 前置：certbot 已签发证书（域名 example.com 已解析到本机）
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.com
# 然后将下面的 server 块放入 /etc/nginx/sites-available/opencode2api-web.conf
# 并 ln -s 到 sites-enabled，nginx -t && systemctl reload nginx。
#
# 说明：
#   - web-server 现在**默认只监听 127.0.0.1**（见 web/main.go 的 -listen 参数），
#     公网流量一律走 443 HTTPS；后端端口不对外，仅本机反代可达。
#   - 领 Key 与 /v1 网关开放给所有用户；管理后台路径 /admin.html 用 Basic Auth 再挡一层，
#     密码与 web-server 管理员密码分开设置（htpasswd -c /etc/nginx/.htpasswd-web admin）。
#   - 登录接口按 IP 限速，缓解管理员密码暴力破解。
#
# ⚠️ 需要更严格的加固（管理面同时加来源网段白名单、proxy_secret 不落明文）时，
#    直接用同目录的 web-server-hardened.conf。

server {
    listen 80;
    server_name example.com;
    # HTTP 全部跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 大模型请求体可能较大，放宽上传限制
    client_max_body_size 64m;

    # 显式关闭目录列表（避免任何被映射成目录的 location 泄露文件列表）
    autoindex off;

    # 通用反向代理参数
    location / {
        # 后端只监听回环（web-server 默认 -listen 127.0.0.1），此处不要改成 0.0.0.0
        proxy_pass http://127.0.0.1:23081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 客户端 IP：必须用 $remote_addr **覆盖**，不能用 $proxy_add_x_forwarded_for。
        # 追加语义下客户端可自带 X-Forwarded-For 伪造 IP，导致「同一 IP 限领一个
        # Key」「网段白名单」「IP 策略」全部被绕过。覆盖后客户端送的头会被丢弃。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/v1 流式响应）需要关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 管理后台再加一层 nginx Basic Auth（独立于 web-server 管理员密码）
    location = /admin.html {
        auth_basic "opencode2api-web admin";
        auth_basic_user_file /etc/nginx/.htpasswd-web;
        proxy_pass http://127.0.0.1:23081;
        proxy_set_header Host $host;
    }

    # 管理接口：仅允许内网/特定 IP，或同样加 Basic Auth
    location /api/admin/ {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:23081;
        proxy_set_header Host $host;
    }

    # 登录接口按 IP 限速：每分钟最多 10 次尝试
    location = /api/admin/login {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:23081;
        proxy_set_header Host $host;
    }
}

# 限速 zone（放 http 块，此处仅作示例，实际需移到 nginx.conf 的 http { } 内）
# limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;
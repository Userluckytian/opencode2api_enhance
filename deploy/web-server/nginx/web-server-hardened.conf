# 网页自助领 Key 服务 nginx 反向代理 + HTTPS（加固版 / 可直接套用）
#
# 本文件是「可直接套用的加固模板」，与同目录 web-server.conf（最小示例）的区别：
#   - 管理后台 admin.html 与 /api/admin/ 同时叠加 **Basic Auth + 来源网段白名单**；
#   - 反代共享密钥 proxy_secret **不写明文**：由部署时渲染的 include 片段注入
#     （见 deploy/web-server/nginx/render-secret.sh / render-secret.ps1）；
#   - 显式 autoindex off，禁止任何目录列表；
#   - 显式把 web-server 上游限定为 127.0.0.1，配合 web-server 自身只监听回环。
#
# 【为什么用 include 片段而不是环境变量】
#   nginx 的 `env` 指令只把变量**继承给 worker 进程**，并不能在配置里当 $变量 用
#   （本机 nginx 1.30.4 实测：nginx -t 报 unknown "testvar" variable）。
#   因此本模板用一个**部署时生成**的片段文件承载密钥：密钥不进版本库、不进本文件，
#   且可用文件权限（0600）限制读取。片段内容形如：
#       proxy_set_header X-Proxy-Secret "10baaee9...（真实值）";
#
# 【部署步骤】
#   1) 生成并安装 Basic Auth 口令文件（与 web-server 管理员口令分开）：
#        sudo apt install apache2-utils
#        sudo htpasswd -c /etc/nginx/.htpasswd-web admin     # 首次创建（-c 会覆盖，谨慎）
#        sudo chmod 640 /etc/nginx/.htpasswd-web && sudo chown root:www-data /etc/nginx/.htpasswd-web
#   2) 渲染反代共享密钥片段（密钥来自 web-server 启动日志的「[反代密钥] xxx」
#      或 web-data/config.json 的 proxy_secret；**轮换过就重新渲染**）：
#        export TOKEN_BUFFET_PROXY_SECRET='xxxx'
#        sudo bash deploy/web-server/nginx/render-secret.sh /etc/nginx/snippets/token-buffet-proxy-secret.conf
#   3) 放置配置并校验：
#        sudo cp deploy/web-server/nginx/web-server-hardened.conf /etc/nginx/sites-available/opencode2api-web.conf
#        sudo ln -s /etc/nginx/sites-available/opencode2api-web.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# 【验证方法】
#   - 未带 Basic Auth 访问后台 → 期望 401：
#        curl -s -o $null -w '%{http_code}\n' https://example.com/admin.html
#   - 带了正确 Basic Auth 但来源 IP 不在白名单 → 期望 403：
#        curl -s -o $null -w '%{http_code}\n' -u admin:pass https://example.com/api/admin/keys
#   - 直连后端端口 → 期望连接被拒（web-server 只监听回环）：
#        curl -s -o $null -w '%{http_code}\n' --max-time 3 http://127.0.0.1:23081/
#
# 【重要】nginx 的 allow/deny 与 auth_basic 是**两道独立的门**：
#   - auth_basic 管「你是谁」，口令泄露即失守；
#   - allow/deny 管「你从哪来」，口令没泄露也挡住内网横向扫描。
#   两者都开，才能让「拿到管理员口令」不再等于「拿到整个管理面」。

server {
    listen 80;
    server_name example.com;
    # HTTP 全部跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 大模型请求体可能较大，放宽上传限制
    client_max_body_size 64m;

    # 显式关闭目录列表：任何被映射成静态目录的 location 都不允许列目录
    autoindex off;

    # ── 管理后台页面：Basic Auth + 来源网段白名单（两道门都要开）────────────────
    location = /admin.html {
        auth_basic "opencode2api-web admin";
        auth_basic_user_file /etc/nginx/.htpasswd-web;

        # 只允许运维网段访问管理页面。改成你自己的网段，不要写 0.0.0.0/0。
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;   # ← 改成运维网段
        deny all;

        proxy_pass http://127.0.0.1:23081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /token-buffet;
    }

    # ── 管理接口：Basic Auth + 来源网段白名单（与后台页面同策略）───────────────
    location /api/admin/ {
        auth_basic "opencode2api-web admin";
        auth_basic_user_file /etc/nginx/.htpasswd-web;

        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;   # ← 改成运维网段
        deny all;

        proxy_pass http://127.0.0.1:23081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /token-buffet;
    }

    # ── 登录接口：单独限速（按来源 IP），并沿用同一套白名单 ────────────────────
    location = /api/admin/login {
        limit_req zone=adminlogin burst=5 nodelay;

        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/16;   # ← 改成运维网段
        deny all;

        proxy_pass http://127.0.0.1:23081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /token-buffet;
    }

    # ── 领 Key 页与 /v1 网关：对外开放（这是本服务的对外职能）─────────────────
    # 保持**纯 proxy_pass**：不要用 alias/root 指向 web-data 数据目录，
    # 否则 config.json / keys.json（内含上游密钥与全部 Key 明文）会被静态读走。
    location / {
        proxy_pass http://127.0.0.1:23081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 客户端 IP：必须用 $remote_addr **覆盖**，不能用 $proxy_add_x_forwarded_for。
        # 追加语义下客户端可自带 X-Forwarded-For 伪造 IP，导致「同一 IP 限领一个
        # Key」「网段白名单」「IP 策略」全部被绕过。覆盖后客户端送的头会被丢弃。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 反代共享密钥：**不写明文**，由部署时渲染的片段注入。
        # web-server 只有在 X-Proxy-Secret 与配置一致时才采信上面的 IP 头，
        # 否则一律用 RemoteAddr（防止同机低权限进程伪造来源 IP 绕过全部 IP 限制）。
        # 片段文件缺失时 nginx -t 会直接失败（fail-closed），不会静默裸奔。
        include /etc/nginx/snippets/token-buffet-proxy-secret.conf;

        # SSE（/v1 流式响应）需要关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 限速 zone（必须放在 nginx.conf 的 http { } 内，此处仅作示例）
# limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;